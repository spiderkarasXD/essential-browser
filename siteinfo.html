<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Сайт</title>
  <link rel="stylesheet" href="siteinfo.css">
</head>
<body>
  <div id="backdrop"></div>
  <div id="pop">
    <i id="notch"></i>

    <!-- главная страница, как Site Controls в Arc -->
    <section class="page" id="page-main">
      <div class="sec-title">Расширения</div>
      <div id="ext-grid"></div>

      <div class="group">
        <div class="row" id="pip-row">
          <div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="12" y="11" width="7" height="6" rx="1.5"/></svg></div>
          <div class="label">Автоматическая «картинка в картинке»<div class="hint">видео не останавливается, когда уходишь с вкладки</div></div>
          <label class="switch"><input type="checkbox" id="pip"><span></span></label>
        </div>
      </div>

      <footer>
        <button id="secure-pill"></button>
        <div class="spacer"></div>
        <button id="more" title="Ещё"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
        <div id="more-menu">
          <button data-action="copy"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Копировать ссылку</button>
          <button data-action="hardReload"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>Обновить без кэша</button>
          <button data-action="source"><svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>Исходный код</button>
          <button data-action="devtools"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>Инструменты разработчика</button>
        </div>
      </footer>
    </section>

    <!-- настройки сайта: открываются по «Защищено» -->
    <section class="page" id="page-site" hidden>
      <header>
        <button class="back" data-go="main"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div id="fav"></div>
        <div class="who">
          <div id="host"></div>
          <div id="conn"></div>
        </div>
      </header>

      <div class="group">
        <div class="row">
          <div class="ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8.5 11h5M11 8.5v5"/></svg></div>
          <div class="label">Масштаб</div>
          <div class="zoom">
            <button id="zoom-out" title="Уменьшить (Ctrl+-)">−</button>
            <button id="zoom-val" title="Сбросить (Ctrl+0)"></button>
            <button id="zoom-in" title="Увеличить (Ctrl+=)">+</button>
          </div>
        </div>
        <div class="row">
          <div class="ico"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></div>
          <div class="label">Звук</div>
          <label class="switch"><input type="checkbox" id="sound"><span></span></label>
        </div>
      </div>

      <div class="caption">Разрешения для этого сайта</div>
      <div class="group" id="perms"></div>

      <div class="group">
        <div class="row">
          <div class="ico"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9 3 3 0 0 0 4 4 3 3 0 0 0 5 5z"/><circle cx="8.5" cy="10.5" r="1"/><circle cx="14" cy="15" r="1"/></svg></div>
          <div class="label">Cookies и данные<div class="hint" id="cookies"></div></div>
          <button class="danger" id="clear">Очистить</button>
        </div>
      </div>
    </section>

    <!-- добавление расширений -->
    <section class="page" id="page-add" hidden>
      <header>
        <button class="back" data-go="main"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="who"><div id="add-title">Добавить расширения</div></div>
      </header>
      <div id="import-list"></div>
      <div class="add-actions">
        <button id="unpacked">Папка с расширением…</button>
        <button id="store">Chrome Web Store</button>
      </div>
      <button class="primary" id="do-import" disabled>Перенести</button>
      <div class="hint" id="import-note"></div>
    </section>
  </div>
  <script src="favicon.js"></script>
  <script src="siteinfo.js"></script>
</body>
</html>
