<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Essential</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- верхняя панель как в Arc; по F11 уезжает вверх -->
  <header id="toolbar">
    <div class="tb-left">
      <button class="logo-btn" data-act="settings" title="Essential — настройки (Ctrl+,)"><img src="build/icon.png" alt=""></button>
      <button class="icon" data-act="sidebar" title="Скрыть панель (Ctrl+S)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <div class="tb-nav">
        <button class="icon" data-act="back" title="Назад (Alt+←)"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <button class="icon" data-act="forward" title="Вперёд (Alt+→)"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <button class="icon reload" data-act="reload" title="Обновить (F5)">
          <svg class="i-reload" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="tb-center">
      <button class="icon sm" data-act="copy" title="Копировать ссылку (Ctrl+Shift+C)">
        <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      </button>
      <button id="tb-url" data-act="address" title="Адрес (Ctrl+L)"></button>
      <button class="icon sm" data-act="site" title="Настройки сайта">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
    <div class="tb-right">
      <span class="zoom" data-act="zoom" title="Сбросить масштаб (Ctrl+0)"></span>
      <div id="tb-ext"></div>
      <!-- кружок загрузок, как в Arc: кольцо заполняется по мере скачивания -->
      <button class="icon dl-btn" id="dl-btn" data-act="downloads" title="Загрузки (Ctrl+J)" hidden>
        <svg class="ring" viewBox="0 0 24 24">
          <circle class="track" cx="12" cy="12" r="9.5"/>
          <circle class="bar" cx="12" cy="12" r="9.5" pathLength="100"/>
        </svg>
        <svg class="glyph arrow" viewBox="0 0 24 24"><path d="M12 7v9M8 12.5l4 4 4-4"/></svg>
        <svg class="glyph check" viewBox="0 0 24 24"><path d="M7.5 12.5l3 3 6-6.5"/></svg>
        <span class="dl-count"></span>
      </button>
      <button class="icon pin" data-act="pin" title="Закрепить сайт (Ctrl+D)">
        <svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 4H6l4-4z"/><path d="M12 14v6"/></svg>
      </button>
      <div class="winctl">
        <button class="icon" data-act="min" title="Свернуть"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button class="icon max" data-act="max" title="Развернуть">
          <svg class="i-max" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          <svg class="i-restore" viewBox="0 0 24 24"><rect x="5" y="9" width="10" height="10" rx="2"/><path d="M9 9V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/></svg>
        </button>
        <button class="icon danger" data-act="close" title="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
  </header>

  <aside id="sidebar">
    <!-- навигация в сайдбаре нужна только в полноэкранном режиме, когда верхней панели нет -->
    <div class="topbar">
      <div class="row">
        <button class="icon" data-act="back" title="Назад (Alt+←)"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="icon" data-act="forward" title="Вперёд (Alt+→)"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        <button class="icon reload" data-act="reload" title="Обновить (F5)">
          <svg class="i-reload" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>

    <button id="urlbar" title="Адрес (Ctrl+L)">
      <svg id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <svg id="glass" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
      <span id="urltext"></span>
      <span id="zoom" title="Сбросить масштаб (Ctrl+0)"></span>
    </button>

    <div id="essentials"></div>

    <div id="ws-wrap">
      <button id="ws-header" title="Изменить пространство">
        <span id="ws-icon"></span>
        <span id="ws-name"></span>
        <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div id="ws-pop">
        <input id="ws-name-input" maxlength="40" spellcheck="false" placeholder="Название пространства">
        <div id="ws-icons"></div>
        <div class="pop-actions">
          <button id="ws-theme">🎨 Тема</button>
          <button id="ws-del">🗑 Удалить</button>
        </div>
      </div>
    </div>

    <button id="newtab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Новая вкладка</span></button>
    <div id="tabs"></div>

    <div class="bottombar">
      <div id="ws-list"></div>
      <button id="ws-add" class="icon" title="Новое пространство"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon" data-act="settings" title="Настройки (Ctrl+,)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </aside>

  <div id="bg"><div class="layer"></div><div class="layer"></div></div>
  <div id="grain"></div>
  <div id="card"></div>
  <div id="edge"></div>
  <div id="toast"></div>

  <script src="favicon.js"></script>
  <script src="theme.js"></script>
  <script src="ui.js"></script>
</body>
</html>
